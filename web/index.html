<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#152a21" />
    <title>Kancha · Personal PM</title>
    <link rel="icon" href="/mark.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to workspace</a>
    <div id="shell">
      <aside class="rail">
        <div class="brand"><img src="/mark.svg" alt="" /><span>Kancha</span></div>
        <div class="railcaption">Personal workspace</div>
        <nav id="nav" aria-label="Workspace"></nav>
        <div class="railfoot">
          <div class="device"><i></i>Local device</div>
          <div id="profile"></div>
        </div>
      </aside>
      <div class="canvas">
        <header class="top">
          <div class="crumb">
            <img src="/icons/panels-top-left.svg" alt="" />Workspace<span>/</span
            ><b id="crumb">Focus desk</b>
          </div>
          <div class="topactions">
            <button id="searchButton" aria-label="Search work">
              <img src="/icons/search.svg" alt="" /><span>Search work</span><kbd>Ctrl K</kbd></button
            ><button
              id="syncButton"
              class="iconbutton"
              aria-label="Refresh sources"
              title="Refresh sources"
            >
              <img src="/icons/refresh-cw.svg" alt="" />
            </button>
          </div>
        </header>
        <main id="main" tabindex="-1"><div class="loading">Opening your local workspace…</div></main>
      </div>
    </div>
    <dialog id="dialog"><div id="dialogBody"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
